name: Build & Test

on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      suite:
        description: "full 跑整个 scheme；fast/ui 需要先配置对应的 test plan"
        type: choice
        options: [fast, ui, full]
        default: full
      record_snapshots:
        description: 重新录制快照参考图（本项目暂无快照测试）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # Pinned to the fork with two Xcode 27 fixes: the xcode-27 runner and a
    # simulator boot before launch evidence. Based on ios-ci-workflows @ a04bf44.
    uses: Breast-dressing/ios-ci-workflows/.github/workflows/build-test.yml@e9a521bcd653155548d733afe7d172918a7f959e
    with:
      suite: ${{ inputs.suite || '' }}
      record_snapshots: ${{ inputs.record_snapshots || false }}
