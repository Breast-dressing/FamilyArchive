name: Dump SwiftUI API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: xcode-27
    steps:
      - name: Dump reorder API
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          IFACE="$SDK/System/Library/Frameworks/SwiftUI.framework/Modules/SwiftUI.swiftmodule/arm64-apple-ios-simulator.swiftinterface"
          sed -n '12460,12540p' "$IFACE"
