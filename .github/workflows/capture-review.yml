name: Capture UI Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode
        run: xcodebuild -version

      - name: Capture review screenshots
        run: bash scripts/capture-review.sh

      - name: Upload review screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-review-screenshots
          path: |
            music_tab_ui.png
            my_page_sections_ui.png
            fans_ui.png
            medals_ui.png
            cards_ui.png
            family_detail_ui.png
            member_detail_ui.png
            feed_tab_ui.png
            feed_search_ui.png
            feed_search_focused_ui.png
            video_tab_ui.png
            more_tab_ui.png
            bar_exit_a_ui.png
            bar_exit_b_ui.png
            bar_diag.txt
            date_filter_sheet_ui.png
            feed_plus_sheet_ui.png
            accounts_sheet_ui.png
            music_plus_sheet_ui.png
            share_sheet_ui.png
            family_honor_export.png
            tour_member_ui.png
            tour_family_ui.png
            tour_archive_ui.png
          if-no-files-found: warn
          retention-days: 14
