name: Capture UI Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode
        run: xcodebuild -version

      - name: Capture review screenshots
        run: bash scripts/capture-review.sh

      - name: Upload review screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-review-screenshots
          path: |
            music_tab_ui.png
            family_detail_ui.png
          if-no-files-found: warn
          retention-days: 14
