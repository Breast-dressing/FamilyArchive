name: Debug Clipboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Probe simulator clipboard
        run: |
          set -euo pipefail
          xcrun simctl help pbcopy || true
          xcrun simctl help pbpaste || true
          xcrun simctl help privacy | sed -n '1,160p' || true

          UDID="$(xcrun simctl list devices available --json | python3 -c '
import json, sys
data = json.load(sys.stdin)["devices"]
for runtime, devices in data.items():
    if "iOS-27-0" in runtime:
        for device in devices:
            if device["name"] == "iPhone 18 Pro":
                print(device["udid"])
                raise SystemExit(0)
raise SystemExit(1)
')"
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

          URL='https://i2.y.qq.com/?family_id=987654321'
          printf '%s' "$URL" | xcrun simctl pbcopy -v "$UDID"
          echo "pbcopy rc=$?"
          sleep 2
          xcrun simctl pbpaste -v "$UDID" > /tmp/clip.txt
          echo "pbpaste rc=$?"
          echo "clipboard bytes: $(wc -c < /tmp/clip.txt)"
          cat /tmp/clip.txt
          echo
